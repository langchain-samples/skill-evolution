# Routine version bumps are switched off for this repo, deliberately.
#
# The compatible-release pins in pyproject.toml and the committed uv.lock exist so
# that `uv sync` reproduces the environment the documented run was measured on. An
# automated bump past a tested minor version silently invalidates that claim, which
# is the one claim this repo is making. Upgrades here should be a decision followed
# by a re-run, not a merge.
#
# `open-pull-requests-limit: 0` disables version-update pull requests. Dependabot
# *security* updates are configured outside this file and are not affected by it, so
# advisories still surface.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
